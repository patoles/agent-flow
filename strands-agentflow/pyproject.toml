[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strands-agentflow"
version = "0.1.0"
description = "Agent-Flow visualizer integration for Strands Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "strands-agents>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
